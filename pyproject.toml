[build-system]
requires      = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmn-analysis"
version = "0.2.0"
description = "Motion receptive fields from contiguous motion noise (CMN) recordings by reverse correlation"
readme = "README.md"
authors = [{ name = 'Tim Hladnik', email = "contact@vxpy.org" }]
license = { file = 'LICENSE' }
classifiers = [
        'Development Status :: 3 - Alpha',
        'Intended Audience :: Science/Research',
        'License :: OSI Approved :: MIT License',
        'Operating System :: POSIX :: Linux',
        'Operating System :: Microsoft :: Windows',
        'Programming Language :: Python',
        'Programming Language :: Python :: 3.10',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Topic :: Scientific/Engineering'
]
keywords = ['neuroscience', 'receptive field', 'reverse correlation', 'data analysis']
dependencies = [
    'numpy>=1.26',
    'scipy>=1.11',
    'h5py>=3.8',
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ['pytest>=8', 'build']

[project.urls]
Homepage = 'https://github.com/thladnik/contiguous-motion-noise-analysis'

[tool.setuptools.packages.find]
where = ['.']
include = ['cmn_analysis*']

[tool.pytest.ini_options]
testpaths = ['tests']
